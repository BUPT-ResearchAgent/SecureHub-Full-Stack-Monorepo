# .codex/config.toml
# SecureHub project-scoped Codex configuration.
# These are Codex development assistants, not SecureHub runtime/product agents.

model = "gpt-5.5"
model_reasoning_effort = "high"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
# Cost-aware default: do not fan out too aggressively.
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1200